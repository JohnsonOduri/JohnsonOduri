<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Representative system architecture: client layer, API and backend, authentication, data layer, applied AI, deployment">
  <defs>
    <pattern id="agrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#131a23" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7291"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#090c10"/>
  <rect width="1000" height="430" fill="url(#agrid)" opacity="0.5"/>

  <text x="40" y="36" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#5b6573">SYSTEM ARCHITECTURE</text>
  <rect x="40" y="46" width="130" height="2.5" fill="url(#edge)"/>

  <!-- Row 1 -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
    <!-- Box 1 -->
    <rect x="40" y="80" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="170" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#38bdf8">Client Layer</text>
    <text x="170" y="144" text-anchor="middle" font-size="12.5" fill="#9aa4b2">React · Next.js</text>
    <text x="170" y="162" text-anchor="middle" font-size="12.5" fill="#9aa4b2">React Native (Expo)</text>

    <!-- Box 2 -->
    <rect x="370" y="80" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="500" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#38bdf8">API &amp; Backend</text>
    <text x="500" y="144" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Node.js / Express</text>
    <text x="500" y="162" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Flask · FastAPI</text>

    <!-- Box 3 -->
    <rect x="700" y="80" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="830" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#38bdf8">Auth &amp; Access</text>
    <text x="830" y="144" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Firebase Auth · OAuth</text>
    <text x="830" y="162" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Role-based access control</text>

    <line x1="300" y1="132" x2="366" y2="132" stroke="#5b7291" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="630" y1="132" x2="696" y2="132" stroke="#5b7291" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- snake connector row1 -> row2 -->
    <path d="M 830 184 C 830 230, 170 230, 170 276" fill="none" stroke="#5b7291" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Row 2 -->
    <!-- Box 4 -->
    <rect x="40" y="280" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="170" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">Data Layer</text>
    <text x="170" y="344" text-anchor="middle" font-size="12.5" fill="#9aa4b2">PostgreSQL · Firestore</text>
    <text x="170" y="362" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Supabase</text>

    <!-- Box 5 -->
    <rect x="370" y="280" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="500" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">Applied AI</text>
    <text x="500" y="344" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Gemini API · RAG</text>
    <text x="500" y="362" text-anchor="middle" font-size="12.5" fill="#9aa4b2">pgvector retrieval</text>

    <!-- Box 6 -->
    <rect x="700" y="280" width="260" height="104" rx="10" fill="#0f141b" stroke="#1f2a37"/>
    <text x="830" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">Deployment</text>
    <text x="830" y="344" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Vercel · Docker</text>
    <text x="830" y="362" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Firebase Hosting</text>

    <line x1="300" y1="332" x2="366" y2="332" stroke="#5b7291" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="630" y1="332" x2="696" y2="332" stroke="#5b7291" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="414" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#454e5c">Representative flow across NearFind, ORION, SecondMind and VK Wash — stack varies per project.</text>
</svg>
