<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Johnson Oduri — Software Engineer, Full-Stack, Backend, Applied AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090c10"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="fade" cx="78%" cy="45%" r="60%">
      <stop offset="0" stop-color="#0b0f16" stop-opacity="0"/>
      <stop offset="1" stop-color="#090c10" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#151c26" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <style>
      .node { animation: pulse 3.2s ease-in-out infinite; }
      .n2 { animation-delay: .6s; }
      .n3 { animation-delay: 1.3s; }
      .n4 { animation-delay: 2s; }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <!-- network / systems motif, right side -->
  <g stroke="#2a3645" stroke-width="1.1" fill="none" opacity="0.9">
    <path d="M 760 70 L 860 105 L 945 60 L 1040 95 L 1125 55"/>
    <path d="M 860 105 L 905 175 L 1000 165 L 1040 95"/>
    <path d="M 905 175 L 845 230 L 965 245 L 1000 165"/>
    <path d="M 1040 95 L 1105 150 L 1125 55"/>
    <path d="M 965 245 L 1105 150"/>
  </g>
  <g fill="#38bdf8">
    <circle class="node" cx="760" cy="70" r="3.4"/>
    <circle class="node n3" cx="945" cy="60" r="3.4"/>
    <circle class="node n2" cx="1125" cy="55" r="3.4"/>
  </g>
  <g fill="#818cf8">
    <circle class="node n2" cx="860" cy="105" r="4.2"/>
    <circle class="node n4" cx="1040" cy="95" r="4.2"/>
    <circle class="node n3" cx="1105" cy="150" r="3.6"/>
  </g>
  <g fill="#22d3ee">
    <circle class="node n3" cx="905" cy="175" r="3.4"/>
    <circle class="node n4" cx="1000" cy="165" r="3.4"/>
    <circle class="node n2" cx="845" cy="230" r="3"/>
    <circle class="node" cx="965" cy="245" r="3"/>
  </g>

  <!-- terminal prompt -->
  <text x="64" y="78" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#5b6573">visitor@github</text>
  <text x="192" y="78" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#39415080">:~$</text>
  <text x="224" y="78" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8b93a1"> whoami</text>
  <rect class="cursor" x="320" y="66" width="8" height="15" fill="#38bdf8"/>

  <!-- name -->
  <text x="62" y="152" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="56" font-weight="700" fill="#f5f7fa">Johnson Oduri</text>

  <!-- role -->
  <text x="64" y="190" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="19" letter-spacing="0.5" fill="#38bdf8">Software Engineer — Full-Stack · Backend · Applied AI</text>

  <!-- accent bar -->
  <rect x="64" y="208" width="360" height="3" rx="1.5" fill="url(#accentBar)"/>

  <!-- tagline -->
  <text x="64" y="240" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#7d8697">Real-time systems · REST APIs · RAG &amp; LLM workflows · Production deployments</text>

  <text x="64" y="268" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#454e5c">B.Tech CSE, IIIT Kottayam · Hyderabad, India</text>
</svg>
